#         「远程内容已通过当前 VPN 配置加载」——iOS 检测到 VPN 后放弃 Private Relay，改走 VPN 通道取图。
#   机理：中继域名走代理时，QUIC over UDP 443 在节点侧被丢/挂起，Mail 等不到响应 → fail-safe 不加载；
