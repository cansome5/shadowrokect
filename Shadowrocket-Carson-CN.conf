# ============================================================
# 规则说明：
# 1. 从上到下匹配，命中即停
# 2. 广告拦截在最前，确保番茄去广告生效
# 3. 国内直连在广告之后、国外代理之前
# 4. 国外服务按类型分组，便于解锁地区限制
# 5. 国内兜底 + GEOIP CN 在最后，确保国内流量不绕路
# ============================================================

# ===== 第0层：私有网络直连（局域网/路由器）=====
# 注意：所有 RULE-SET 必须使用 geo/geosite/classical/ 路径。
# 根目录的 *.list 是 Clash 的 "+.domain" 语法，小火箭不解析，会导致规则集静默失效。
RULE-SET,https://raw.githubusercontent.com/MetaCubeX/meta-rules-dat/meta/geo/geosite/classical/private.list,DIRECT

# ===== 第0.2层：运营商号码认证 / 一键登录（必须直连）2026-11-13 新增 =====
# 原理：国内 App 的「本机号码一键登录」由运营商 SDK 在蜂窝网络下向网关取号，
#       网关凭「来源是蜂窝出口 IP」识别号码。若这些域名被 FINAL 推去代理，
#       网关看到的是机房 IP → 取号失败，App 自动回落短信验证码。
# 注意：与 ipv6 = false 无关（那只控制 AAAA 记录），真正会坏的是「走代理」。
DOMAIN-SUFFIX,cmpassport.com,DIRECT
DOMAIN-SUFFIX,10086.cn,DIRECT
DOMAIN-SUFFIX,10010.com,DIRECT
DOMAIN-SUFFIX,wo.cn,DIRECT
DOMAIN-SUFFIX,189.cn,DIRECT
DOMAIN-SUFFIX,jpush.cn,DIRECT

# ===== 第0.5层：STUN / WebRTC 防泄漏（2026-11-13 新增）=====
# 为什么加：iOS Safari 的 WebRTC 用 UDP 发 STUN 探测，会拿到真实公网 IP。
# 下面两个域名原本落到 bilibili.list（📽 哔哩哔哩 默认「全球直连」）→ 直连发出 → 泄漏家宽 IP。
# Mac 上实测过同一问题（暴露出 14.146.47.182 广州家宽），iOS 同理。
# 走代理后：要么代理侧出口 IP，要么 UDP 不通超时 —— 两种都不会泄漏。
DOMAIN-SUFFIX,stun.chat.bilibili.com,🚀 策略选择
DOMAIN-SUFFIX,stun.cloudflare.com,🚀 策略选择

